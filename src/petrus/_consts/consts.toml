[CONST]
PATH_HELP = "The path where the project will be created/currently exists."
DESC = """Create/update a python project. The default values of the (non flag) options are taken from the default table of the config.toml file inside of the petrus package.
Modify at %r.
See also %r."""
LINK = "https://pypi.org/project/petrus/"
MIT-LINE = "This project is licensed under the MIT License."
PROJECT-KEYS = [
    "authors",
    "classifiers",
    "dependencies",
    "description",
    "keywords",
    "license",
    "license_files",
    "name",
    "readme",
    "requires_python",
    "version",
    "urls",
]

[DRAFTS.core]
package = "petrus.drafts.src._.core"
resource = "___init__.py.txt"

[DRAFTS.gitignore]
package = "petrus.drafts"
resource = "_.gitignore.txt"

[DRAFTS.init]
package = "petrus.drafts.src._"
resource = "___init__.py.txt"

[DRAFTS.license]
package = "petrus.drafts"
resource = "_LICENSE.txt.txt"

[DRAFTS.main]
package = "petrus.drafts.src._"
resource = "___main__.py.txt"

[DRAFTS.manifest]
package = "petrus.drafts"
resource = "_MANIFEST.in.txt"

[DRAFTS.readme]
package = "petrus.drafts"
resource = "_README.rst.txt"

[DRAFTS.test_1984]
package = "petrus.drafts.src._.tests"
resource = "_test_1984.py.txt"

[DRAFTS.tests]
package = "petrus.drafts.src._.tests"
resource = "___init__.py.txt"

[INPUTS]
author = "The author of the project."
classifiers = "The classifiers of the project. Comma separated. You may include {preset}. Recommended value is '{preset}, Programming Language :: Python, Programming Language :: Python :: 3, Programming Language :: Python :: 3 :: Only'."
description = "The description of the project."
development_status = "The projects development status. Communicated as a classifier. May be 'infer'."
email = "Email of the author."
requires_python = "The python version of the project. A list separated by '\\|'. The first non empty item is used. You may use {preset} and {current}. Recommended value is '{preset} \\| {current}'."
github = "The github username for linking the source."
token = "The PyPI token."
v = "Version string for the project. Recommended is 'bump(2, 1)'."
vformat = "Format of the version string, i.e. how many numerals in the release string. Recommended is '3'."
year = "Year of creating the project. Recommended is '{current}'."
